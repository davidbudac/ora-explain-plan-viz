<canvas id="c" width="1920" height="1080"></canvas>

<script>
'use strict';
/*
 * Oracle Plan Visualizer — 15 s promo reel.
 * Everything is a pure function of time: draw(t) paints the frame at t seconds.
 * render.mjs drives window.renderFrame(i, samples) frame by frame (with
 * sub-frame motion blur) and pipes screenshots into ffmpeg.
 *
 *   0.0–2.3   wall of DBMS_XPLAN text, counter to 1,412
 *   2.3–5.0   nine rows fly out → tree cards, edges, row flow
 *   5.0–7.8   push into hotspot, advisor findings, 898 → 997,412 = 1,110×
 *   7.8–10.2  four panels: flame, sankey, ASH timeline, calibration scatter
 *  10.2–12.3  Plan A vs Plan B, matched-node ties, deltas
 *  12.3–15.0  end card
 */
const W = 1920, H = 1080, DUR = 15, FPS = 60, SHUTTER = 0.5;

const C = {
  bg: '#07080B', surf: '#0F1218', surf2: '#151922', line: '#262B37',
  ink: '#F3EFE6', dim: '#8B90A0', faint: '#4A4F5E',
  lime: '#C8FF4D', hot: '#FF4A1C', amber: '#FFB020', violet: '#9D8CFF', cyan: '#5CD3FF', mint: '#4DFFB8',
};
const F = { serif: '"Instrument Serif"', sans: '"Inter Tight"', mono: '"JetBrains Mono"' };

const cv = document.getElementById('c');
const main = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const buf = mk(), bufCtx = buf.getContext('2d');
const layer = mk(), layerCtx = layer.getContext('2d');
let g = main;

// ---------------------------------------------------------------- utilities
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const rad = d => d * Math.PI / 180;
const E = {
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  inOutQuint: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const hexA = (h, a) => { const [r, gg, b] = rgb(h); return `rgba(${r},${gg},${b},${a})`; };
const mix = (h1, h2, t) => { const a = rgb(h1), b = rgb(h2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], clamp(t)))).join(',')})`; };
const font = (w, s, f, it = false) => `${it ? 'italic ' : ''}${w} ${s}px ${f}`;
const fmt = n => Math.round(n).toLocaleString('en-US');
const fmtK = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 2).replace(/\.?0+$/, '') + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'K' : String(n);
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); }
function txt(s, x, y, o = {}) {
  g.save();
  g.font = o.font; g.fillStyle = o.color || C.ink; g.textAlign = o.align || 'left';
  g.textBaseline = o.base || 'alphabetic'; g.letterSpacing = o.ls || '0px';
  g.textRendering = o.font.includes('Mono') ? 'optimizeSpeed' : 'auto';
  if (o.alpha != null) g.globalAlpha *= o.alpha;
  if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = o.glowBlur || 24; }
  g.fillText(s, x, y); g.restore();
}
function measure(s, f, ls = '0px') { g.save(); g.font = f; g.letterSpacing = ls; g.textRendering = f.includes('Mono') ? 'optimizeSpeed' : 'auto'; const w = g.measureText(s).width; g.restore(); return w; }
function fitSize(s, weight, family, size, maxW) { const w = measure(s, font(weight, size, family)); return w > maxW ? size * maxW / w : size; }

/** Word-by-word reveal (rise + de-blur), optional staggered exit. */
function words(str, x, y, size, t, t0, o = {}) {
  const f = font(o.weight || 400, size, o.family || F.serif, o.italic !== false && !o.family);
  const ws = str.split(' ');
  const sp = measure(' ', f), wd = ws.map(w => measure(w, f));
  const total = wd.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
  const st = o.stagger ?? .07, dur = o.dur ?? .55;
  ws.forEach((w, i) => {
    const p = E.outCubic(P(t, t0 + i * st, t0 + i * st + dur));
    const q = o.out != null ? E.inCubic(P(t, o.out + i * st * .5, o.out + i * st * .5 + .3)) : 0;
    const a = p * (1 - q);
    if (a > .002) {
      g.save(); g.globalAlpha *= a; g.font = f; g.fillStyle = (o.colors && o.colors[i]) || o.color || C.ink;
      const b = (1 - p) * 14 + q * 12; if (b > .4) g.filter = `blur(${b.toFixed(1)}px)`;
      if (o.glow && o.colors && o.colors[i]) { g.shadowColor = o.colors[i]; g.shadowBlur = 30; }
      g.fillText(w, cx, y + (1 - p) * size * .35 - q * size * .3); g.restore();
    }
    cx += wd[i] + sp;
  });
  return total;
}
function arrow(x1, y1, x2, y2, p, col, lw = 3) {
  if (p <= 0) return;
  const x = lerp(x1, x2, p), y = lerp(y1, y2, p);
  g.save(); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x, y); g.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1);
  g.beginPath(); g.moveTo(x - 16 * Math.cos(a - .5), y - 16 * Math.sin(a - .5)); g.lineTo(x, y); g.lineTo(x - 16 * Math.cos(a + .5), y - 16 * Math.sin(a + .5)); g.stroke();
  g.restore();
}
function flash(t, at, dur, col, peak) {
  const p = P(t, at, at + dur); if (p <= 0 || p >= 1) return;
  const a = peak * (1 - E.outCubic(p));
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  const gr = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 1100);
  gr.addColorStop(0, hexA(col, a)); gr.addColorStop(1, hexA(col, a * .25));
  g.fillStyle = gr; g.fillRect(0, 0, W, H); g.restore();
}
const SHAKES = [[6.8, 16, .45], [11.12, 5, .3], [11.3, 5, .3], [11.48, 5, .3]];
function shake(t) {
  let x = 0, y = 0;
  for (const [at, amp, d] of SHAKES) {
    const p = P(t, at, at + d); if (p <= 0 || p >= 1) continue;
    const k = amp * Math.pow(1 - p, 2);
    x += k * (Math.sin(t * 97.3) + Math.sin(t * 61.7 + 1.1)) / 2;
    y += k * (Math.sin(t * 83.9 + 2.3) + Math.sin(t * 53.1 + .4)) / 2;
  }
  return { x, y };
}

// ---------------------------------------------------------------- plan data
const CAT = { stmt: C.ink, agg: C.amber, join: C.violet, table: C.cyan, index: C.mint };
const NODES = [
  { id: 0, op: 'SELECT STATEMENT', obj: '', cat: 'stmt', d: 0, par: -1, e: 0, a: 25, time: 41.8, self: 0, buf: '2148K' },
  { id: 1, op: 'HASH GROUP BY', obj: '', cat: 'agg', d: 1, par: 0, e: 24, a: 25, time: 41.8, self: .1, buf: '2148K' },
  { id: 2, op: 'HASH JOIN', obj: '', cat: 'join', d: 2, par: 1, e: 2694, a: 997412, time: 41.7, self: .2, buf: '2148K' },
  { id: 3, op: 'TABLE ACCESS FULL', obj: 'CUSTOMERS', cat: 'table', d: 3, par: 2, e: 50000, a: 50000, time: .2, self: .2, buf: '1204' },
  { id: 4, op: 'NESTED LOOPS', obj: '', cat: 'join', d: 3, par: 2, e: 1204, a: 997412, time: 41.3, self: 0, buf: '2146K' },
  { id: 5, op: 'NESTED LOOPS', obj: '', cat: 'join', d: 4, par: 4, e: 1011, a: 997412, time: 36.0, self: 0, buf: '1143K' },
  { id: 6, op: 'TABLE ACCESS FULL', obj: 'ORDERS', cat: 'table', d: 5, par: 5, e: 898, a: 997412, time: 31.4, self: 31.4, buf: '41K', hot: true },
  { id: 7, op: 'INDEX RANGE SCAN', obj: 'ORD_ITEMS_IX', cat: 'index', d: 5, par: 5, e: 1, a: 997412, time: 4.6, self: 4.6, starts: 997412, buf: '1102K' },
  { id: 8, op: 'TABLE ACCESS BY INDEX ROWID', obj: 'ORDER_ITEMS', cat: 'table', d: 4, par: 4, e: 1, a: 997412, time: 5.3, self: 5.3, starts: 997412, buf: '1003K' },
];
const CHILDREN = { 0: [1], 1: [2], 2: [3, 4], 4: [5, 8], 5: [6, 7] };
const misest = n => { if (!n.e) return 1; const et = n.e * (n.starts || 1); return Math.max(n.a / et, et / n.a); };
const CW = 260, CH = 74, SLOT = 290, TX0 = 1250 - 1.5 * SLOT;
const SLOTS = { 3: 0, 6: 1, 7: 2, 8: 3, 5: 1.5, 4: 2.25, 2: 1.125, 1: 1.125, 0: 1.125 };
NODES.forEach(n => { n.x = TX0 + SLOTS[n.id] * SLOT; n.y = 110 + n.d * 160; });

// ---------------------------------------------------------------- wall text
const LH = 21, WALLFS = 15, BOTTOM = 940, TROW = 1388, NLINES = 1412;
let WALL = [], WX = 0, ROWW = 0;
const pS = (v, n) => String(v).padStart(n), pE = (v, n) => String(v).padEnd(n).slice(0, n);
const fmtRow = (id, op, nm, st, er, ar, at, bf) => `| ${pS(id, 3)} | ${pE(op, 36)} | ${pE(nm, 14)} | ${pS(st, 7)} | ${pS(er, 7)} | ${pS(ar, 7)} | ${pS(at, 11)} | ${pS(bf, 8)} |`;
function buildWall() {
  const R = rng(1412), L = [];
  const push = (s, k) => L.push({ s, k });
  const sep = '-'.repeat(fmtRow('', '', '', '', '', '', '', '').length);
  const hdr = fmtRow('Id', 'Operation', 'Name', 'Starts', 'E-Rows', 'A-Rows', 'A-Time', 'Buffers');
  const ops = ['NESTED LOOPS', 'HASH JOIN', 'TABLE ACCESS FULL', 'INDEX RANGE SCAN', 'INDEX UNIQUE SCAN', 'TABLE ACCESS BY INDEX ROWID BATCHED', 'SORT ORDER BY', 'HASH GROUP BY', 'VIEW', 'UNION-ALL', 'FILTER', 'PX SEND HASH', 'PX RECEIVE', 'PX BLOCK ITERATOR', 'BUFFER SORT', 'MERGE JOIN CARTESIAN', 'PARTITION RANGE ITERATOR', 'HASH JOIN OUTER', 'WINDOW SORT', 'NESTED LOOPS OUTER', 'SORT AGGREGATE', 'VIEW PUSHED PREDICATE', 'HASH JOIN SEMI', 'INDEX FAST FULL SCAN'];
  const names = ['', '', '', 'ORDERS', 'ORDER_ITEMS', 'CUSTOMERS', 'PRODUCTS', 'PK_ORDERS', 'ORD_CUST_IX', 'SHIPMENTS', 'INVOICES', 'INV_LINES', 'LEDGER_ENTRIES', 'GL_ACCOUNTS', 'VW_NSO_1', ':TQ10003', 'PRICE_HIST', 'REGIONS', 'WAREHOUSES', 'STOCK_MOVES'];
  const tm = () => { const s = R() * 60; return `00:00:${s.toFixed(2).padStart(5, '0')}`; };
  let id = 0, depth = 1;
  const planRows = n => {
    for (let i = 0; i < n; i++) {
      depth = clamp(depth + (R() < .55 ? 1 : -(R() * 3 | 0)), 1, 22);
      const op = ops[R() * ops.length | 0], nm = /TABLE|INDEX/.test(op) ? names[3 + (R() * (names.length - 3) | 0)] : names[R() * names.length | 0];
      const er = Math.round(Math.pow(10, R() * 5)), ar = Math.round(er * Math.pow(10, (R() - .4) * 2.5));
      push(fmtRow(id++, ' '.repeat(depth) + op, nm, fmtK(Math.round(1 + R() * R() * 2e4)), fmtK(er), fmtK(ar), tm(), fmtK(Math.round(R() * 9e4))), 'row');
    }
  };
  push('SQL_ID  4xw1q9mbc0t7z, child number 2', 'meta'); push('-'.repeat(40), 'sep'); push('', 'b');
  push('Plan hash value: 3958120476', 'meta'); push('', 'b'); push(sep, 'sep'); push(hdr, 'hdr'); push(sep, 'sep');
  while (L.length < 1040) planRows(1);
  push(sep, 'sep'); push('', 'b'); push('Query Block Name / Object Alias (identified by operation id):', 'hdr'); push('-'.repeat(62), 'sep');
  for (let i = 0; i < 40; i++) push(`   ${pS(R() * id | 0, 4)} - SEL$${(R() * 99 | 0) + 1}  / "T${R() * 40 | 0}"@"SEL$${(R() * 9 | 0) + 1}"`, 'pred');
  push('', 'b'); push('Predicate Information (identified by operation id):', 'hdr'); push('-'.repeat(51), 'sep');
  const cols = ['ORDER_ID', 'CUST_ID', 'STATUS_CODE', 'REGION', 'AMOUNT', 'CREATED_AT', 'SKU', 'WH_ID', 'LEDGER_ID'];
  while (L.length < 1320) {
    const a = cols[R() * cols.length | 0], b = cols[R() * cols.length | 0];
    push(`   ${pS(R() * id | 0, 4)} - ${R() < .5 ? 'access' : 'filter'}("T${R() * 40 | 0}"."${a}"${R() < .3 ? '>=:B' + (R() * 9 | 0) : '="T' + (R() * 40 | 0) + '"."' + b + '"'})`, 'pred');
  }
  push('', 'b'); push('Note', 'hdr'); push('-----', 'sep'); push('   - Degree of Parallelism is 8 because of hint', 'note'); push('   - this is an adaptive plan', 'note'); push('', 'b');
  while (L.length < TROW - 11) push(`   ${pS(R() * id | 0, 4)} - "T${R() * 40 | 0}"."${cols[R() * cols.length | 0]}"[NUMBER,22], "T${R() * 40 | 0}"."${cols[R() * cols.length | 0]}"[VARCHAR2,40]`, 'pred');
  // --- the statement that matters
  push('', 'b'); push('SQL_ID  8f2kq0v7rn3xw, child number 0', 'meta'); push('-'.repeat(37), 'sep');
  push('SELECT c.region, SUM(i.amount) FROM orders o JOIN order_items i ON i.order_id = o.order_id', 'sql');
  push('JOIN customers c ON c.cust_id = o.cust_id WHERE o.status_code = :b1 GROUP BY c.region', 'sql'); push('', 'b');
  push('Plan hash value: 2741930512', 'meta'); push('', 'b'); push(sep, 'sep'); push(hdr, 'hdr'); push(sep, 'sep');
  for (const n of NODES) push(fmtRow(n.id, ' '.repeat(n.d) + n.op, n.obj, fmtK(n.starts || 1), n.e ? fmtK(n.e) : '', fmtK(n.a), `00:00:${n.time.toFixed(2).padStart(5, '0')}`, n.buf), 'target');
  push(sep, 'sep'); push('', 'b'); push('Predicate Information (identified by operation id):', 'hdr'); push('-'.repeat(51), 'sep'); push('', 'b');
  push('   2 - access("C"."CUST_ID"="O"."CUST_ID")', 'pred'); push('   6 - filter(TO_NUMBER("O"."STATUS_CODE")=:B1)', 'pred'); push('   7 - access("I"."ORDER_ID"="O"."ORDER_ID")', 'pred');
  push('', 'b'); push('Note', 'hdr'); push('-----', 'sep'); push('   - this is an adaptive plan', 'note'); push('', 'b'); push('1412 rows selected.', 'meta'); push('SQL> ', 'prompt');
  if (L.length !== NLINES || L[TROW].k !== 'target') console.warn('wall length', L.length, L[TROW].k);
  return L;
}
const WALLSTYLE = { row: [C.ink, .5], sep: [C.faint, .9], hdr: [C.dim, 1], pred: [C.violet, .6], meta: [C.amber, .75], sql: [C.ink, .7], prompt: [C.lime, .95], note: [C.dim, .7], target: [C.ink, .5], b: [C.ink, 0] };

function wallXf(t) {
  const e1 = E.inOutCubic(P(t, 0, 2.05)), e2 = E.outCubic(P(t, 2.0, 2.3));
  return {
    a: rad(lerp(lerp(-9, -3, e1), -2, e2)),
    s: lerp(lerp(1.9, .96, e1), 1.0, e2),
    fx: lerp(WX + 300, W / 2, e1), fy: lerp(BOTTOM - 40, 540, e1),
  };
}
function wallToScreen(xf, x, y) {
  const dx = (x - xf.fx) * xf.s, dy = (y - xf.fy) * xf.s, c = Math.cos(xf.a), s = Math.sin(xf.a);
  return { x: W / 2 + dx * c - dy * s, y: H / 2 + dx * s + dy * c };
}
const wallCount = t => NLINES * E.inOutCubic(P(t, 0, 2.0));

function sceneWall(t) {
  const fadeAll = 1 - E.outCubic(P(t, 2.3, 2.75));
  if (fadeAll <= 0) return;
  const n = wallCount(t), xf = wallXf(Math.min(t, 2.3));

  // ghost parallax layer (huge, faint, faster)
  const G = n * 1.7, base = Math.floor(G), fr = G - base;
  g.save(); g.globalAlpha = .045 * fadeAll * lerp(1, .3, P(t, 1.8, 2.2)); g.font = font(500, 60, F.mono); g.fillStyle = C.ink;
  g.translate(W / 2, H / 2); g.rotate(rad(-14)); g.translate(-W / 2, -H / 2);
  for (let k = 0; k < 16; k++) { const li = base - k; if (li < 0) break; g.fillText(WALL[(li * 7) % 1300].s.slice(0, 60), -200, 1300 - (k + fr) * 92); }
  g.restore();

  const dimOthers = lerp(1, .16, E.outCubic(P(t, 1.95, 2.25)));
  const hl = E.outCubic(P(t, 1.98, 2.25));
  g.save();
  g.translate(W / 2, H / 2); g.rotate(xf.a); g.scale(xf.s, xf.s); g.translate(-xf.fx, -xf.fy);
  const last = Math.floor(n) - 1, first = Math.max(0, last - 70);
  for (let i = first; i <= last; i++) {
    const L = WALL[i], [col, al] = WALLSTYLE[L.k];
    if (!L.s) continue;
    const isT = L.k === 'target';
    if (isT && t >= 2.3) continue;
    const y = BOTTOM - (n - 1 - i) * LH;
    const head = clamp(1 - (last - i) / 5);
    let a = Math.max(al, head * .95);
    if (isT) a = lerp(a, 1, hl); else a *= dimOthers;
    if (isT && hl > 0) {
      const bw = (ROWW + 20) * E.outCubic(P(t, 1.98 + (i - TROW) * .018, 2.2 + (i - TROW) * .018));
      g.fillStyle = hexA(C.lime, .14 * fadeAll); g.fillRect(WX - 10, y - 15, bw, LH - 1);
      g.fillStyle = hexA(C.lime, fadeAll); g.fillRect(WX - 10, y - 15, 3, LH - 1);
    }
    g.globalAlpha = a * fadeAll;
    g.font = font(isT && hl > .5 ? 500 : 400, WALLFS, F.mono); g.textRendering = 'optimizeSpeed';
    g.fillStyle = isT && hl > 0 ? mix(col, C.ink, hl) : col;
    g.fillText(L.s, WX, y);
    g.globalAlpha = 1;
  }
  // cursor block at the typing head
  if (t < 2.3 && Math.floor(t * 4) % 2 === 0) { g.fillStyle = C.lime; g.fillRect(WX + (t > 2.0 ? 5 * 9 : 0), BOTTOM + 5, 9, 17); }
  g.restore();

  // HUD: command line (typed), counter
  const hud = 1 - E.inCubic(P(t, 2.05, 2.4));
  if (hud > 0) {
    const cmd = "SQL> SELECT * FROM TABLE(DBMS_XPLAN.DISPLAY_CURSOR(format => 'ALLSTATS LAST'));";
    const nch = Math.floor(cmd.length * P(t, 0, .45));
    g.save(); g.globalAlpha = hud;
    const sg = g.createLinearGradient(0, 0, 0, 170); sg.addColorStop(0, 'rgba(7,8,11,.95)'); sg.addColorStop(1, 'rgba(7,8,11,0)');
    g.fillStyle = sg; g.fillRect(0, 0, W, 170);
    g.globalAlpha = hud * (1 - P(t, .45, .7));

  });
  g.restore();
}

// ---------------------------------------------------------------- end card
const GLYPH_DOC = 'M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z';
let DOC_PATH, DOC_LEN = 60;
function sceneEnd(t) {
  if (t < 12.2) return;
  const lt = t - 12.3;
  // backdrop glow + drifting flow particles
  const ga = P(t, 12.2, 12.8);
  const gr = g.createRadialGradient(W / 2, 400, 0, W / 2, 400, 900);
  gr.addColorStop(0, hexA(C.lime, .09 * ga)); gr.addColorStop(.5, hexA(C.violet, .04 * ga)); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const R = rng(5);
  for (let i = 0; i < 70; i++) {
    const x = R() * W, sp = 40 + R() * 90, y = (H + 40 - ((R() * H + (t - 12.2) * sp) % (H + 80))), r = .8 + R() * 2.2;
    g.fillStyle = hexA(R() < .15 ? C.hot : C.lime, (.08 + R() * .25) * ga); g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  // glyph
  const S = 8.2, gx = W / 2 - 12 * S, gy = 340 - 12 * S;
  const gin = E.outBack(P(lt, 0, .45));
  g.save(); g.translate(W / 2, 340); g.scale(lerp(.6, 1, gin), lerp(.6, 1, gin)); g.translate(-W / 2, -340);
  g.translate(gx, gy); g.scale(S, S);
  g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 1.7;
  const dp = E.inOutCubic(P(lt, 0, .7));
  g.setLineDash([DOC_LEN * dp, DOC_LEN]); g.strokeStyle = C.ink; g.shadowColor = hexA(C.ink, .4); g.shadowBlur = 3; g.stroke(DOC_PATH); g.setLineDash([]);
  [[9, 2, C.lime], [12, 4, C.lime], [15, 6, C.hot]].forEach(([bx, len, col], i) => {
    const bp = E.outBack(P(lt, .45 + i * .1, .8 + i * .1)); if (bp <= 0) return;
    g.strokeStyle = col; g.shadowColor = col; g.shadowBlur = 6; g.lineWidth = 2;
    g.beginPath(); g.moveTo(bx, 17); g.lineTo(bx, 17 - len * bp); g.stroke();
  });
  g.restore();

  // wordmark, letter by letter
  const wm = 'Oracle Plan Visualizer', wf = font(700, 104, F.sans);
  const tw = measure(wm, wf, '-3px');
  let x = W / 2 - tw / 2;
  g.save(); g.font = wf; g.letterSpacing = '-3px';
  for (let i = 0; i < wm.length; i++) {
    const ch = wm[i], cw = measure(ch, wf, '-3px');
    const p = E.outCubic(P(lt, .5 + i * .022, .95 + i * .022));
    if (p > 0) {
      g.save(); g.globalAlpha *= p; g.fillStyle = C.ink;
      if (p < 1) g.filter = `blur(${((1 - p) * 10).toFixed(1)}px)`;
      g.fillText(ch, x, 600 + (1 - p) * 40); g.restore();
    }
    x += cw;
  }
  g.restore();
  words('Execution plans, finally readable.', W / 2, 686, 56, t, 13.25, { align: 'center', stagger: .06, color: C.dim, colors: { 3: C.lime } });
  const dl = E.inOutCubic(P(lt, 1.1, 1.6));
  g.fillStyle = hexA(C.faint, .8); g.fillRect(W / 2 - 240 * dl, 738, 480 * dl, 1);
  const url = 'davidbudac.github.io/ora-explain-plan-viz', un = Math.floor(url.length * P(lt, 1.35, 1.95));
  const uf = font(500, 30, F.mono), uw = measure(url, uf);
  txt(url.slice(0, un), W / 2 - uw / 2, 808, { font: uf, color: C.lime, glow: hexA(C.lime, .35), glowBlur: 18 });
  if (lt > 1.3 && (lt < 1.95 || Math.floor(t * 3) % 2 === 0)) { g.fillStyle = C.lime; g.fillRect(W / 2 - uw / 2 + measure(url.slice(0, un), uf) + 4, 784, 14, 30); }
  txt('FREE  ·  OPEN SOURCE  ·  RUNS 100% IN YOUR BROWSER', W / 2, 872, { font: font(500, 16, F.mono), color: C.faint, align: 'center', ls: '4px', alpha: P(lt, 1.8, 2.2) });
}

// ---------------------------------------------------------------- frame
let DOTS;
function background(t) {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  g.save(); g.globalAlpha = .9; g.translate(-((t * 6) % 48), -((t * 3) % 48)); g.fillStyle = DOTS; g.fillRect(0, 0, W + 96, H + 96); g.restore();
}
function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = 'none';
  background(t);
  const sh = shake(t);
  g.save(); g.translate(sh.x, sh.y);
  sceneWall(t);
  g.restore();
  sceneTree(t); // handles its own shake (layered)
  g.save(); g.translate(sh.x, sh.y);
  sceneViews(t);
  sceneCompare(t);
  sceneEnd(t);
  g.restore();
  flash(t, 7.78, .3, C.ink, .28);
  flash(t, 12.28, .35, C.lime, .12);
}
let GRAIN = [];
function post(fi) {
  const c = main;
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
  const vg = c.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 1250);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.62)');
  c.fillStyle = vg; c.fillRect(0, 0, W, H);
  const R = rng(fi * 31 + 7);
  c.globalAlpha = .9; c.fillStyle = GRAIN[fi % GRAIN.length];
  c.translate(-(R() * 256 | 0), -(R() * 256 | 0)); c.fillRect(0, 0, W + 256, H + 256);
  c.restore();
}
window.renderFrame = (fi, samples = 1) => {
  const t0 = fi / FPS;
  if (samples <= 1) { g = main; draw(t0); post(fi); return; }
  for (let i = 0; i < samples; i++) {
    const ts = clamp(t0 + ((i + .5) / samples - .5) * SHUTTER / FPS, 0, DUR - 1e-4);
    g = bufCtx; draw(ts);
    main.setTransform(1, 0, 0, 1, 0, 0); main.globalAlpha = 1 / (i + 1); main.drawImage(buf, 0, 0);
  }
  main.globalAlpha = 1; g = main; post(fi);
};
window.renderAt = t => { g = main; draw(t); post(Math.round(t * FPS)); };
window.meta = { W, H, DUR, FPS };

window.ready = (async () => {
  await Promise.all([
    'italic 400 40px "Instrument Serif"', '400 40px "Instrument Serif"',
    ...[400, 500, 600, 700, 800].map(w => `${w} 40px "Inter Tight"`),
    ...[400, 500, 700].map(w => `${w} 40px "JetBrains Mono"`),
  ].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  WALL = buildWall();
  ROWW = measure(WALL[TROW].s, font(400, WALLFS, F.mono));
  WX = (W - ROWW) / 2;
  const sp = document.createElementNS('http://www.w3.org/2000/svg', 'path'); sp.setAttribute('d', GLYPH_DOC);
  DOC_LEN = sp.getTotalLength(); DOC_PATH = new Path2D(GLYPH_DOC);
  // dot grid + grain tiles
  const dc = document.createElement('canvas'); dc.width = dc.height = 48; const dx = dc.getContext('2d');
  dx.fillStyle = 'rgba(255,255,255,.045)'; dx.beginPath(); dx.arc(24, 24, 1.1, 0, Math.PI * 2); dx.fill();
  DOTS = main.createPattern(dc, 'repeat');
  const R = rng(3);
  for (let k = 0; k < 4; k++) {
    const nc = document.createElement('canvas'); nc.width = nc.height = 256; const nx = nc.getContext('2d');
    const im = nx.createImageData(256, 256);
    for (let i = 0; i < im.data.length; i += 4) { const v = R() < .5 ? 0 : 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = R() * 14; }
    nx.putImageData(im, 0, 0); GRAIN.push(main.createPattern(nc, 'repeat'));
  }
  return true;
})();

// preview mode: scene.html?play  (or ?t=5.2 for a still)
(async () => {
  const q = new URLSearchParams(location.search);
  await window.ready;
  if (q.has('t')) { window.renderAt(+q.get('t')); return; }
  if (!q.has('play')) return;
  document.body.classList.add('preview');
  const scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), pp = document.getElementById('pp');
  let playing = true, t = 0, last = performance.now();
  pp.onclick = () => { playing = !playing; pp.textContent = playing ? 'pause' : 'play'; };
  scrub.oninput = () => { t = +scrub.value; playing = false; pp.textContent = 'play'; };
  addEventListener('keydown', e => { if (e.code === 'Space') pp.onclick(); if (e.code === 'ArrowRight') t = Math.min(DUR, t + 1 / FPS); if (e.code === 'ArrowLeft') t = Math.max(0, t - 1 / FPS); });
  const loop = now => {
    if (playing) { t += (now - last) / 1000; if (t >= DUR) t = 0; scrub.value = t; }
    last = now; tc.textContent = t.toFixed(2); window.renderAt(t);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
