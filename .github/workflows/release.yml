name: Release single-file build

# Push a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`) to
# publish a GitHub release with the self-contained HTML attached.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for
        required: true

# Read-only by default: the job that installs and runs third-party code (npm ci,
# tests, build) gets no write token. Only `publish` may write the release.
permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'davidbudac/ora-explain-plan-viz'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build single file
        run: |
          npm run build:single
          mkdir release
          cp dist-single/index.html "release/oraplanviz-$TAG.html"
          cd release
          sha256sum "oraplanviz-$TAG.html" > "oraplanviz-$TAG.html.sha256"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: single-file
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job, so tell gh which repository to act on.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: single-file
          path: release

      - name: Publish release
        working-directory: release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "oraplanviz-$TAG.html" "oraplanviz-$TAG.html.sha256" --clobber
          else
            gh release create "$TAG" "oraplanviz-$TAG.html" "oraplanviz-$TAG.html.sha256" --title "$TAG" --generate-notes
          fi
