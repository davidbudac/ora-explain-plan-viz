name: Feature request
description: Suggest an improvement or a new analysis.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The tuning task or question the app doesn't help with today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you'd like it to work. A sample plan where it matters is very useful.
