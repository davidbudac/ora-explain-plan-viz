<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>plan_to_url.sql in three steps</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #0f172a;
      --color-ink:    #f1f5f9;
      --color-muted:  #94a3b8;
      --color-accent: #fbbf24;
      --font-sans:    'Inter', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'JetBrains Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · ora-explain-plan-viz</p>
    <h1>plan_to_url.sql in three steps</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 168" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plan-to-url-dark-title plan-to-url-dark-desc">
        <title id="plan-to-url-dark-title">plan_to_url.sql in three steps</title>
        <desc id="plan-to-url-dark-desc">Process diagram: run plan_to_url.sql with a sql_id, it prints a link carrying the compressed plan, and clicking the link draws the plan in your browser.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/></marker></defs>
        <rect width="100%" height="100%" fill="#0f172a"/>
        <line x1="320" y1="84" x2="384" y2="84" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="624" y1="84" x2="688" y2="84" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="328" y="64" width="48" height="12" rx="2" fill="#0f172a"/>
        <text x="352" y="73" fill="#8392a8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PRINTS</text>
        <rect x="636" y="64" width="40" height="12" rx="2" fill="#0f172a"/>
        <text x="656" y="73" fill="#fbbf24" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CLICK</text>
        <rect x="40" y="40" width="280" height="88" rx="6" fill="#0f172a"/>
        <rect x="40" y="40" width="280" height="88" rx="6" fill="#1e293b" stroke="#f1f5f9" stroke-width="1"/>
        <rect x="48" y="48" width="52" height="12" rx="2" fill="none" stroke="rgba(241,245,249,0.4)" stroke-width="0.8"/>
        <text x="74" y="57" fill="#f1f5f9" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SQL*PLUS</text>
        <text x="180" y="80" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Run one script</text>
        <text x="180" y="96" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">@plan_to_url.sql &lt;sql_id&gt;</text>
        <rect x="384" y="40" width="240" height="88" rx="6" fill="#0f172a"/>
        <rect x="384" y="40" width="240" height="88" rx="6" fill="rgba(251,191,36,0.1)" stroke="#fbbf24" stroke-width="1"/>
        <rect x="392" y="48" width="28" height="12" rx="2" fill="none" stroke="rgba(251,191,36,0.5)" stroke-width="0.8"/>
        <text x="406" y="57" fill="#fbbf24" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">URL</text>
        <text x="504" y="80" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Get a link</text>
        <text x="504" y="96" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">https://…/#gz=H4sIAAAAAAACA81d…</text>
        <rect x="688" y="40" width="232" height="88" rx="6" fill="#0f172a"/>
        <rect x="688" y="40" width="232" height="88" rx="6" fill="#1e293b" stroke="#f1f5f9" stroke-width="1"/>
        <rect x="696" y="48" width="28" height="12" rx="2" fill="none" stroke="rgba(241,245,249,0.4)" stroke-width="0.8"/>
        <text x="710" y="57" fill="#f1f5f9" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="804" y="80" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">See the plan</text>
        <text x="804" y="96" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">drawn in your browser</text>
      </svg>
    </div>
  </div>
</body>
</html>
