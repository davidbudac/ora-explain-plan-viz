<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The optional DB connector</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #0f172a;
      --color-ink:    #f1f5f9;
      --color-muted:  #94a3b8;
      --color-accent: #fbbf24;
      --font-sans:    'Inter', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'JetBrains Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · ora-explain-plan-viz</p>
    <h1>The optional DB connector</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="db-connector-dark-title db-connector-dark-desc">
        <title id="db-connector-dark-title">The optional DB connector</title>
        <desc id="db-connector-dark-desc">Architecture diagram showing the Plan Visualizer talking to the local oraplanviz-agent connector over localhost HTTP with a bearer token, and the connector reaching the Oracle database over Oracle Net in thin mode.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/></marker></defs>
        <rect width="100%" height="100%" fill="#0f172a"/>
        <rect x="40" y="48" width="616" height="152" rx="8" fill="rgba(241,245,249,0.02)" stroke="rgba(241,245,249,0.18)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="56" y="42" width="76" height="12" rx="2" fill="#0f172a"/>
        <text x="94" y="51" fill="#8392a8" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">YOUR MACHINE</text>
        <line x1="272" y1="124" x2="408" y2="124" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="608" y1="124" x2="760" y2="124" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="300" y="104" width="80" height="12" rx="2" fill="#141b2e"/>
        <text x="340" y="113" fill="#60a5fa" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTP + TOKEN</text>
        <rect x="674" y="104" width="68" height="12" rx="2" fill="#0f172a"/>
        <text x="708" y="113" fill="#8392a8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ORACLE NET</text>
        <rect x="72" y="84" width="200" height="80" rx="6" fill="#0f172a"/>
        <rect x="72" y="84" width="200" height="80" rx="6" fill="#1e293b" stroke="#f1f5f9" stroke-width="1"/>
        <rect x="80" y="92" width="28" height="12" rx="2" fill="none" stroke="rgba(241,245,249,0.4)" stroke-width="0.8"/>
        <text x="94" y="101" fill="#f1f5f9" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="172" y="113" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Plan Visualizer</text>
        <text x="172" y="129" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">self-hosted build</text>
        <text x="172" y="143" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">VITE_ENABLE_DB_AGENT=1</text>
        <rect x="408" y="84" width="200" height="80" rx="6" fill="#0f172a"/>
        <rect x="408" y="84" width="200" height="80" rx="6" fill="rgba(251,191,36,0.1)" stroke="#fbbf24" stroke-width="1"/>
        <rect x="416" y="92" width="20" height="12" rx="2" fill="none" stroke="rgba(251,191,36,0.5)" stroke-width="0.8"/>
        <text x="426" y="101" fill="#fbbf24" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PY</text>
        <text x="508" y="113" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">oraplanviz-agent</text>
        <text x="508" y="129" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1:8521</text>
        <text x="508" y="143" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">python-oracledb, thin mode</text>
        <rect x="760" y="84" width="160" height="80" rx="6" fill="#0f172a"/>
        <rect x="760" y="84" width="160" height="80" rx="6" fill="rgba(241,245,249,0.05)" stroke="#94a3b8" stroke-width="1"/>
        <rect x="768" y="92" width="20" height="12" rx="2" fill="none" stroke="rgba(148,163,184,0.5)" stroke-width="0.8"/>
        <text x="778" y="101" fill="#94a3b8" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="840" y="120" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Oracle Database</text>
        <text x="840" y="136" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">host:1521/service</text>
        <line x1="40" y1="228" x2="920" y2="228" stroke="rgba(241,245,249,0.1)" stroke-width="0.8"/>
        <text x="40" y="244" fill="#94a3b8" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="260" width="14" height="10" rx="2" fill="rgba(251,191,36,0.1)" stroke="#fbbf24" stroke-width="1"/>
        <text x="60" y="268" fill="#94a3b8" font-size="9" font-family="'Inter', system-ui, sans-serif">Connector</text>
        <rect x="136" y="260" width="14" height="10" rx="2" fill="#1e293b" stroke="#f1f5f9" stroke-width="1"/>
        <text x="156" y="268" fill="#94a3b8" font-size="9" font-family="'Inter', system-ui, sans-serif">App</text>
        <rect x="200" y="260" width="14" height="10" rx="2" fill="rgba(241,245,249,0.05)" stroke="#94a3b8" stroke-width="1"/>
        <text x="220" y="268" fill="#94a3b8" font-size="9" font-family="'Inter', system-ui, sans-serif">Database</text>
        <line x1="292" y1="265" x2="320" y2="265" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="328" y="268" fill="#94a3b8" font-size="9" font-family="'Inter', system-ui, sans-serif">Localhost HTTP, bearer token</text>
        <line x1="500" y1="265" x2="528" y2="265" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="536" y="268" fill="#94a3b8" font-size="9" font-family="'Inter', system-ui, sans-serif">Oracle Net</text>
      </svg>
    </div>
  </div>
</body>
</html>
